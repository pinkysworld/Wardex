name: Cross-Browser Smoke

# On-demand cross-browser Playwright smoke run against the admin console.
#
# The default `frontend` job in ci.yml only runs the chromium project so PR
# turnaround stays fast. This workflow runs the same Playwright suite against
# firefox and webkit when started manually (workflow_dispatch) so
# CSS / keyboard / web-platform regressions are caught before release.
#
# Failures here are surfaced as workflow alerts; they do not block PR merges.

on:
  # Manual only: start from Actions -> Run workflow (e.g. before a release).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cross-browser:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [firefox, webkit]
    defaults:
      run:
        working-directory: admin-console
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: admin-console/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright browser (${{ matrix.project }})
        run: npx playwright install --with-deps ${{ matrix.project }}
      - name: Playwright E2E (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cross-browser-playwright-${{ matrix.project }}
          path: |
            admin-console/test-results/
            admin-console/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
